name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 04:17 UTC — picks up any spec drift introduced by
    # Pumble server-side changes.
    - cron: "17 4 * * *"

jobs:
  lint-and-test:
    name: Lint OAS · Generate · Build · Mocked tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sdk/package-lock.json

      - name: Install Speakeasy CLI
        env:
          SPEAKEASY_INSTALLER_SHA256: 9e2c4f1054e214d05352597cfd9ed1ab117a089e9442f532dd4a0d168665d757
        run: |
          set -euo pipefail
          node sdk/scripts/install-speakeasy.mjs
          echo "${HOME}/.speakeasy/bin" >> "${GITHUB_PATH}"

      - name: Install SDK deps
        working-directory: sdk
        run: npm ci --no-audit --no-fund

      - name: Lint OpenAPI spec (0 errors, 0 warnings required)
        run: |
          set -euo pipefail
          out=$(speakeasy lint openapi -s PumbleOpenApi.yaml 2>&1)
          echo "$out"
          echo "$out" | grep -qE '0 errors, 0 warnings' || {
            echo "::error::speakeasy lint reported issues"
            exit 1
          }

      - name: Audit OpenAPI spec quality
        working-directory: sdk
        run: npm run spec:audit

      - name: Regenerate SDK (sanity check — no source drift)
        # Catches schema drift that would silently break a downstream
        # regen. We don't commit the regen output in CI; the diff check
        # below would fail loudly if it had to.
        if: env.SPEAKEASY_API_KEY != ''
        run: |
          speakeasy generate sdk -l typescript -s ./PumbleOpenApi.yaml -o ./sdk -y
          node sdk/scripts/patch-generated-runtime.mjs

      - name: Full regeneration verification unavailable without SPEAKEASY_API_KEY
        if: env.SPEAKEASY_API_KEY == ''
        run: |
          echo "Public CI ran offline verification only; release regeneration requires SPEAKEASY_API_KEY."

      - name: Normalize generated package metadata
        run: node sdk/scripts/normalize-package.mjs

      - name: Check generated diff whitespace
        run: git diff --check

      - name: Verify no drift in committed hand-written paths
        env:
          GUARDED_PATHS: >-
            sdk/src/extensions
            sdk/tests
            sdk/scripts
            sdk/bin/pumble-cli.mjs
            sdk/bin/pumble-mcp.mjs
            sdk/bin/pumble-mcp-args.mjs
            sdk/bin/dry-run-shim.mjs
            sdk/bin/audit-log-shim.mjs
            sdk/package.json
            sdk/package-lock.json
        run: |
          # Speakeasy regen MUST NOT touch hand-written paths — both
          # src/extensions, tests, scripts, and the wrapper shims under bin/
          # are out-of-scope for the generator.
          if ! git diff --quiet -- $GUARDED_PATHS; then
            git diff --stat -- $GUARDED_PATHS
            echo "::error::regen touched hand-written paths"
            exit 1
          fi

      - name: Check no secrets are tracked
        # Borrowed from anon's CI - if a file matching the secret-like
        # pattern is ever committed, fail loudly. Cheap, additive, catches
        # the most common mistake (someone commits .env or a key dump
        # alongside a feature commit). Allowlists .env.example / .template /
        # .sample so documentation templates are still permitted. No use of
        # GitHub event inputs.
        run: |
          set -euo pipefail
          never='(^|/)(tokens\.json|\.pumbleapprc|.*\.db|.*\.db-wal|.*\.db-shm|.*\.pem|.*\.p12)$'
          env_any='(^|/)\.env($|\.[^/]+)$'
          env_ok='\.env\.(example|template|sample)$'
          bad=$(git ls-files | grep -E "$never" || true)
          if [ -n "$bad" ]; then
            echo "::error::Tracked secret-like file detected:"
            echo "$bad"
            exit 1
          fi
          bad=$(git ls-files | grep -E "$env_any" | grep -vE "$env_ok" || true)
          if [ -n "$bad" ]; then
            echo "::error::Tracked env file detected (only .env.example/.template/.sample allowed):"
            echo "$bad"
            exit 1
          fi
          echo "no tracked secret-like files"

      - name: Offline verification
        working-directory: sdk
        run: npm run verify:offline

      - name: Coverage gate (handwritten tree)
        # Runs vitest with --coverage and applies the threshold floor
        # configured in sdk/vitest.config.ts. Gates the handwritten
        # src/extensions/** and src/mcp-server/curated/** tree only;
        # generated code is intentionally excluded (Speakeasy unit-tests
        # the emitted code and SDKP exercises it at the
        # integration/replay level via arazzo). Kept out of verify:offline
        # so local dev iterations stay fast - run npm run test:coverage
        # locally before pushing if you've added handwritten code.
        working-directory: sdk
        run: npm run test:coverage

      - name: CI gate summary
        if: always()
        env:
          SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## CI gate matrix"
            echo "| Gate | Status |"
            echo "| --- | --- |"
            echo "| Offline verification | $JOB_STATUS |"
            if [ -n "$SPEAKEASY_API_KEY" ]; then
              echo "| Speakeasy regeneration | ran |"
            else
              echo "| Speakeasy regeneration | skipped (no secret) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  live-arazzo:
    # Optional nightly job that runs the live arazzo runner against the
    # sacrificial Pumble workspace. Requires PUMBLE_API_KEY repo secret.
    name: Live arazzo runner (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    timeout-minutes: 20
    needs: lint-and-test
    env:
      SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sdk/package-lock.json

      - name: Install Speakeasy CLI
        env:
          SPEAKEASY_INSTALLER_SHA256: 9e2c4f1054e214d05352597cfd9ed1ab117a089e9442f532dd4a0d168665d757
        run: |
          node sdk/scripts/install-speakeasy.mjs
          echo "${HOME}/.speakeasy/bin" >> "${GITHUB_PATH}"

      - name: Install SDK deps
        working-directory: sdk
        run: npm ci --no-audit --no-fund

      - name: Regenerate SDK
        if: env.SPEAKEASY_API_KEY != ''
        run: |
          speakeasy generate sdk -l typescript -s ./PumbleOpenApi.yaml -o ./sdk -y
          node sdk/scripts/patch-generated-runtime.mjs

      - name: Full regeneration verification unavailable without SPEAKEASY_API_KEY
        if: env.SPEAKEASY_API_KEY == ''
        run: |
          echo "Public CI ran offline verification only; release regeneration requires SPEAKEASY_API_KEY."

      - name: Normalize generated package metadata
        run: node sdk/scripts/normalize-package.mjs

      - name: Offline verification
        working-directory: sdk
        run: npm run verify:offline

      - name: Run live arazzo against sacrificial workspace
        working-directory: sdk
        env:
          PUMBLE_API_KEY: ${{ secrets.PUMBLE_API_KEY }}
          PUMBLE_BASE_URL: https://pumble-api-keys.addons.marketplace.cake.com
        run: |
          if [ -z "${PUMBLE_API_KEY}" ]; then
            echo "::warning::PUMBLE_API_KEY secret missing — skipping live arazzo"
            exit 0
          fi
          node scripts/run-arazzo-live.mjs

      - name: Run live vitest
        working-directory: sdk
        env:
          PUMBLE_API_KEY: ${{ secrets.PUMBLE_API_KEY }}
        run: |
          if [ -z "${PUMBLE_API_KEY}" ]; then exit 0; fi
          npm run test:live

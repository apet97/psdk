name: Release

on:
  push:
    tags:
      # Matches v0.3.7, v1.0.0, v1.2.3-rc.1, etc.
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  # Required for npm provenance attestation (sigstore).
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish pumble-keys-sdk to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Read tag → version
        id: tag
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Strip leading "v"; refuse if the tag isn't a clean semver.
          ver="${GITHUB_REF_NAME#v}"
          if ! echo "$ver" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'; then
            echo "::error::tag '${GITHUB_REF_NAME}' is not a semver"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: sdk/package-lock.json

      - name: Install SDK deps
        working-directory: sdk
        run: npm ci --no-audit --no-fund

      - name: Audit OpenAPI spec quality
        working-directory: sdk
        run: npm run spec:audit

      - name: Require package.json version to match the git tag
        # The SDK source is vendored: the release publishes exactly the
        # committed tree. A tag that disagrees with package.json means
        # the bump commit is missing — fail, do not silently rewrite.
        working-directory: sdk
        env:
          TARGET_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          current=$(node -p "require('./package.json').version")
          if [ "$current" != "$TARGET_VERSION" ]; then
            echo "::error::package.json is $current but the tag is $TARGET_VERSION — commit the version bump before tagging"
            exit 1
          fi

      - name: Offline verification (gate)
        working-directory: sdk
        run: npm run verify:offline

      - name: Live verification (required release gate)
        working-directory: sdk
        env:
          PUMBLE_API_KEY: ${{ secrets.PUMBLE_API_KEY }}
        run: npm run verify:live -- --required

      - name: Skip if version is already on npm
        id: check
        working-directory: sdk
        env:
          TARGET_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "pumble-keys-sdk@${TARGET_VERSION}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::pumble-keys-sdk@${TARGET_VERSION} already on npm — skipping publish"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack tarball for evidence
        if: steps.check.outputs.already_published != 'true'
        working-directory: sdk
        run: |
          set -euo pipefail
          npm pack
          echo "TARBALL_PATH=$(ls pumble-keys-sdk-*.tgz | head -n1)" >> "$GITHUB_ENV"

      - name: Write release evidence
        if: steps.check.outputs.already_published != 'true'
        env:
          CI_RUN_URL: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
          RELEASE_RUN_URL: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
          NPM_PROVENANCE: attested
          TARBALL_PATH: ${{ env.TARBALL_PATH }}
        run: node scripts/write-release-evidence.mjs
        working-directory: sdk

      - name: Upload redacted live smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-${{ steps.tag.outputs.version }}
          path: sdk/ci-artifacts/*.log
          if-no-files-found: warn

      - name: Publish to npm with provenance
        if: steps.check.outputs.already_published != 'true'
        working-directory: sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # --provenance attaches an attestation via id-token; --access
          # public because pumble-keys-sdk is unscoped/public.
          npm publish --provenance --access public

      - name: Create GitHub release
        if: steps.check.outputs.already_published != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true

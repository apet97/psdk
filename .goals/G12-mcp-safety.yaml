id: G12
title: Curated MCP safety doc + snapshot test
priority: P1
status: done
why: "Agents need a clear safety map: which profile they should run under, which they should not, and what guarantees each one keeps."
scope:
  allowed:
    - sdk/src/mcp-server/**
    - sdk/docs/MCP-SAFETY.md
    - sdk/tests/mcp-tool-manifest.test.ts
    - sdk/tests/docs.test.ts
    - sdk/README.md
    - sdk/package.json
  forbidden:
    - sdk/src/funcs/**
    - sdk/src/sdk/**
    - sdk/src/models/**
    - sdk/src/lib/**
    - sdk/src/hooks/**
    - sdk/src/types/**
    - sdk/src/core.ts
    - sdk/src/index.ts
acceptance:
  - "listCuratedTools() exposes name/kind/requiresConfirmation triples."
  - "tests/mcp-tool-manifest.test.ts snapshots the curated tool list and fails if a destructive tool name enters."
  - "docs/MCP-SAFETY.md documents the four profiles and their write semantics."
  - "README routes agents to the curated profile and warns against raw readwrite."
commands:
  - "cd sdk && npm test -- tests/mcp-tool-manifest.test.ts tests/docs.test.ts"
  - "cd sdk && npm run goals:check"
adversarial_checks:
  - "Adding a destructive tool name to the curated list fails the test."
  - "Removing the readme warning fails docs.test.ts."
links:
  docs:
    - sdk/docs/MCP-SAFETY.md
  tests:
    - sdk/tests/mcp-tool-manifest.test.ts
rollback: "Revert this commit; existing curated behavior is unchanged."

id: G13
title: CLI polish (doctor, --version, reference doc)
priority: P1
status: done
why: "The CLI needs offline health checks and a single reference doc so users can troubleshoot before running real commands."
scope:
  allowed:
    - sdk/bin/**
    - sdk/docs/CLI-REFERENCE.md
    - sdk/tests/cli.test.ts
  forbidden:
    - sdk/src/funcs/**
    - sdk/src/sdk/**
    - sdk/src/models/**
    - sdk/src/lib/**
    - sdk/src/hooks/**
    - sdk/src/types/**
    - sdk/src/core.ts
    - sdk/src/index.ts
acceptance:
  - "pumble --version emits the package version."
  - "pumble doctor runs without an API key and redacts when one is set."
  - "docs/CLI-REFERENCE.md documents every command including doctor."
commands:
  - "cd sdk && npm test -- tests/cli.test.ts"
  - "cd sdk && npm run goals:check"
adversarial_checks:
  - "Removing the --version branch fails the version test."
  - "Doctor that leaks the raw API key fails the redaction test."
links:
  docs:
    - sdk/docs/CLI-REFERENCE.md
  tests:
    - sdk/tests/cli.test.ts
rollback: "Revert this commit; existing CLI commands continue to work."

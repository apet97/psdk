id: G16
title: Retries, timeouts, rate-limit contract
priority: P1
status: done
why: "Users need one place that states exactly how the SDK retries, when it gives up, and what createRateLimiter / withRetries actually guarantee."
scope:
  allowed:
    - sdk/src/extensions/**
    - sdk/docs/RETRIES-TIMEOUTS-RATE-LIMITS.md
    - sdk/tests/retries-doc.test.ts
  forbidden:
    - sdk/src/funcs/**
    - sdk/src/sdk/**
    - sdk/src/models/**
    - sdk/src/lib/**
    - sdk/src/hooks/**
    - sdk/src/types/**
    - sdk/src/core.ts
    - sdk/src/index.ts
acceptance:
  - "docs/RETRIES-TIMEOUTS-RATE-LIMITS.md captures defaults, timeouts, rate limiter, and withRetries."
  - "tests/retries-doc.test.ts pins the four contract bullets (no-retry writes, Retry-After, process-local limiter, withRetries opt-in)."
commands:
  - "cd sdk && npm test -- tests/retries-doc.test.ts tests/with-retries.test.ts tests/retries.test.ts tests/rate-limiter.test.ts"
  - "cd sdk && npm run goals:check"
adversarial_checks:
  - "Removing the Retry-After mention fails the doc test."
  - "Removing the process-local note fails the limiter test."
links:
  docs:
    - sdk/docs/RETRIES-TIMEOUTS-RATE-LIMITS.md
  tests:
    - sdk/tests/retries-doc.test.ts
rollback: "Revert this commit; existing retry/limiter implementations remain."

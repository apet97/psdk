id: G25
title: Operations checklist (deployment-side)
priority: P1
status: done
why: "Users need a deployment-side checklist that names what the SDK provides and what the operator must supply, without promising service-level guarantees the SDK cannot offer."
scope:
  allowed:
    - sdk/docs/OPERATIONS-CHECKLIST.md
    - sdk/tests/docs.test.ts
  forbidden:
    - sdk/src/funcs/**
    - sdk/src/sdk/**
    - sdk/src/models/**
    - sdk/src/lib/**
    - sdk/src/hooks/**
    - sdk/src/types/**
    - sdk/src/core.ts
    - sdk/src/index.ts
acceptance:
  - "docs/OPERATIONS-CHECKLIST.md lists provided/you-provide responsibilities."
  - "tests/docs.test.ts blocks any SLA/SSO/SCIM/account-manager/premium-support/hosted-control-plane claim from sneaking in."
commands:
  - "cd sdk && npm test -- tests/docs.test.ts"
  - "cd sdk && npm run goals:check"
adversarial_checks:
  - "Adding 'SLA' to the doc fails the boundary test."
  - "Removing the Secret/Audit/Rate-limit bullets fails the coverage test."
links:
  docs:
    - sdk/docs/OPERATIONS-CHECKLIST.md
  tests:
    - sdk/tests/docs.test.ts
rollback: "Revert this commit; no production impact until the owning task lands."

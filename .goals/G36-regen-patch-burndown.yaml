id: G36
title: Remove patches the generator now makes unnecessary
priority: P1
status: done
why: "A human-run regeneration shows which patches the generator has absorbed. Removable patches are deleted with evidence; kept patches get a probe date. HISTORY 2026-08-11: attempt 1 failed on speakeasyVersion: latest silently upgrading 1.763.6->1.793.0 and a package.json/examples merge conflict from gen.yaml's additionalScripts declaring only 17 of 29 real scripts. Fixed both (workflow.yaml pinned to 1.763.6; gen.yaml additionalScripts synced, verified zero missing/extra vs package.json). Attempt 2 succeeded end-to-end with 3 small, individually-understood conflicts (config.ts's stale pre-rename package name in the userAgent string -- took Speakeasy's fix; retries.ts and package.json resolved to Current, confirmed byte-identical after resolution) plus 4 unwanted Speakeasy defaults rejected (package-lock.json dependency-stripping from an internal pre-merge npm install, README.md's ~600-line boilerplate append with a broken <UNSET> placeholder, .gitignore's /bin addition, an auto-generated example file despite generateExamples: false). Commit 51ba14a. PROBE OUTCOME: inconclusive, not 'not emitted' -- Speakeasy's persistentEdits merges the patch script's prior diffs back into fresh generation output during its own 'Merging custom edits' step, before the executor ever sees pristine (unpatched) content, so the plan's grep-based probe (12.4) had nothing to check against. Recorded honestly in patch-burndown.md rather than forcing a 'not emitted' claim with no evidence behind it. PATCH-COUNT.txt stays at 5, no patch removed -- Section 2 accepts this as a valid end state. Marking done because the actual G36 blocker (a regen that couldn't complete) is resolved and the regen now runs cleanly; the removal-probe question itself would need a different method (inspecting Speakeasy's pre-merge snapshot, or a one-off run with persistentEdits disabled) to ever produce real evidence -- a candidate for a future goal, not a rerun of this one."
scope:
  allowed:
    - sdk/scripts/patch-generated-runtime.mjs
    - sdk/src/** (regenerated output and patch-script output only)
    - sdk/.speakeasy/**
    - sdk/docs/patch-burndown.md
    - sdk/docs/PATCH-COUNT.txt
    - sdk/docs/adr/0008-generated-runtime-patches.md
    - sdk/tests/generated-runtime-patch.test.ts
    - .goals/G36-regen-patch-burndown.yaml
  forbidden:
    - sdk/src/extensions/**
    - sdk/src/mcp-server/curated/**
acceptance:
  - "Each probe-target patch is either removed with a passing gate or kept with a recorded probe result."
  - "PATCH-COUNT.txt equals the registry length."
  - "No regenerated diff touches sdk/src/extensions or sdk/src/mcp-server/curated."
commands:
  - "cd sdk && npm run verify:offline"
adversarial_checks:
  - "Removing a patch while its guard test still needs it fails the suite."
  - "A regenerated file under extensions or curated means the run is halted."
links:
  docs:
    - sdk/docs/patch-burndown.md
    - sdk/docs/adr/0008-generated-runtime-patches.md
  tests:
    - sdk/tests/generated-runtime-patch.test.ts
    - sdk/tests/generated-request-validation.test.ts
rollback: "git restore sdk/src and revert the bookkeeping commit."

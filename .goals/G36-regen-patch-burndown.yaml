id: G36
title: Remove patches the generator now makes unnecessary
priority: P1
status: done
why: |
  A human-run regeneration shows which patches the generator has absorbed.
  Removable patches are deleted with evidence; kept patches get a probe date.

  OUTCOME (2026-08-11): the regen now runs end-to-end (two config bugs fixed
  along the way: a silent CLI auto-upgrade, and gen.yaml/package.json script
  drift). The removal probe itself came back inconclusive, not "not
  emitted" -- persistentEdits merges the patch script's prior diffs back
  into fresh output before the executor ever sees pristine content, so
  there was nothing to grep against. No patch removed; PATCH-COUNT.txt
  stays at 5, which plan section 2 accepts as a valid end state on its own.

  Marked done because the actual blocker -- a regen that couldn't complete
  -- is resolved. The removal-probe question needs a different method
  (inspect Speakeasy's pre-merge snapshot, or a one-off run with
  persistentEdits disabled) to ever produce real evidence; that's a
  candidate for a future goal, not a rerun of this one.

  Full history (both failed attempts, every conflict resolved and why,
  every Speakeasy default rejected and why): sdk/docs/patch-burndown.md's
  "2026-08-11 regen probe" section. Commits: 8f42d0f (config fix),
  51ba14a (successful regen), ba5bd79 (probe outcome recorded).
scope:
  allowed:
    - sdk/scripts/patch-generated-runtime.mjs
    - sdk/src/** (regenerated output and patch-script output only)
    - sdk/.speakeasy/**
    - sdk/docs/patch-burndown.md
    - sdk/docs/PATCH-COUNT.txt
    - sdk/docs/adr/0008-generated-runtime-patches.md
    - sdk/tests/generated-runtime-patch.test.ts
    - .goals/G36-regen-patch-burndown.yaml
  forbidden:
    - sdk/src/extensions/**
    - sdk/src/mcp-server/curated/**
acceptance:
  - "Each probe-target patch is either removed with a passing gate or kept with a recorded probe result."
  - "PATCH-COUNT.txt equals the registry length."
  - "No regenerated diff touches sdk/src/extensions or sdk/src/mcp-server/curated."
commands:
  - "cd sdk && npm run verify:offline"
adversarial_checks:
  - "Removing a patch while its guard test still needs it fails the suite."
  - "A regenerated file under extensions or curated means the run is halted."
links:
  docs:
    - sdk/docs/patch-burndown.md
    - sdk/docs/adr/0008-generated-runtime-patches.md
  tests:
    - sdk/tests/generated-runtime-patch.test.ts
    - sdk/tests/generated-request-validation.test.ts
rollback: "git restore sdk/src and revert the bookkeeping commit."

id: G36
title: Remove patches the generator now makes unnecessary
priority: P1
status: blocked
why: "A human-run regeneration shows which patches the generator has absorbed. Removable patches are deleted with evidence; kept patches get a probe date. BLOCKED 2026-08-11: the maintainer ran 'cd sdk && speakeasy run' (auto-upgraded to Speakeasy CLI 1.793.0, not the 1.763.6 the plan's evidence base assumed). It failed: 'could not apply persistent edits for typescript: merge conflicts detected in 2 file(s)' (package.json, examples/README.md). The generated side of the package.json conflict was missing most of the repo's custom npm scripts (verify:offline pipeline, goals:check, test:guards, test:docs, test:mcp) and several extensions/* export map entries, so auto-resolution was unsafe. sdk/src/extensions/** and sdk/src/mcp-server/curated/** were untouched by the regen (the one hard guardrail held). The maintainer decided to drop the Speakeasy regen requirement for this pass rather than hand-resolve the conflict live; the working tree was reverted to the pre-regen commit (b5a29e0) with 'git restore --source=HEAD --staged --worktree'. PATCH-COUNT.txt stays at 5 with no probe evidence, which the plan's Section 2 calls an acceptable end state on its own (just without the ideal probe date). Unblock in a dedicated follow-up session: first reconcile package.json's drift from Speakeasy's template (likely needs matching Speakeasy's persistent-edits regions), then rerun the regen."
scope:
  allowed:
    - sdk/scripts/patch-generated-runtime.mjs
    - sdk/src/** (regenerated output and patch-script output only)
    - sdk/.speakeasy/**
    - sdk/docs/patch-burndown.md
    - sdk/docs/PATCH-COUNT.txt
    - sdk/docs/adr/0008-generated-runtime-patches.md
    - sdk/tests/generated-runtime-patch.test.ts
    - .goals/G36-regen-patch-burndown.yaml
  forbidden:
    - sdk/src/extensions/**
    - sdk/src/mcp-server/curated/**
acceptance:
  - "Each probe-target patch is either removed with a passing gate or kept with a recorded probe result."
  - "PATCH-COUNT.txt equals the registry length."
  - "No regenerated diff touches sdk/src/extensions or sdk/src/mcp-server/curated."
commands:
  - "cd sdk && npm run verify:offline"
adversarial_checks:
  - "Removing a patch while its guard test still needs it fails the suite."
  - "A regenerated file under extensions or curated means the run is halted."
links:
  docs:
    - sdk/docs/patch-burndown.md
    - sdk/docs/adr/0008-generated-runtime-patches.md
  tests:
    - sdk/tests/generated-runtime-patch.test.ts
    - sdk/tests/generated-request-validation.test.ts
rollback: "git restore sdk/src and revert the bookkeeping commit."

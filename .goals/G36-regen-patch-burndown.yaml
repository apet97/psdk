id: G36
title: Remove patches the generator now makes unnecessary
priority: P1
status: blocked
why: "A human-run regeneration shows which patches the generator has absorbed. Removable patches are deleted with evidence; kept patches get a probe date. BLOCKED 2026-08-11: the maintainer ran 'cd sdk && speakeasy run'. It auto-upgraded to CLI 1.793.0 via 'speakeasyVersion: latest' in .speakeasy/workflow.yaml (now pinned to 1.763.6, matching the currently-committed generated tree's provenance). It failed: 'could not apply persistent edits for typescript: merge conflicts detected in 2 file(s)' (package.json, examples/README.md). ROOT CAUSE (confirmed, not just suspected): generation itself succeeded cleanly (its own lint+build passed, zero conflicts in src/, sdk/src/extensions/** and sdk/src/mcp-server/curated/** untouched -- the one hard guardrail held). The conflict was purely config drift: .speakeasy/gen.yaml's typescript.additionalScripts declared only 17 of package.json's 29 real scripts (goals:check, test:guards, test:docs, test:mcp, test:unit, test:cli, test:smoke, test:coverage, prepublishOnly, test:facade:live, test:mcp:live, build, build:mcp were added to package.json by hand without also updating gen.yaml), so Speakeasy regenerated a package.json missing those scripts and couldn't 3-way-merge it against the real one. FIXED 2026-08-11: gen.yaml's additionalScripts now declares all 29 scripts verbatim (verified via python3 yaml parse: zero missing, zero extra vs package.json). The working tree from the failed attempt was reverted to the pre-regen commit (b5a29e0) with 'git restore --source=HEAD --staged --worktree'; the gen.yaml/workflow.yaml fixes are a separate, later commit. PATCH-COUNT.txt stays at 5 with no probe evidence, which the plan's Section 2 calls an acceptable end state on its own. Unblock by rerunning 'cd sdk && speakeasy run' in a follow-up session -- the config drift that caused the failure is now fixed, so this should merge cleanly (not guaranteed until actually run)."
scope:
  allowed:
    - sdk/scripts/patch-generated-runtime.mjs
    - sdk/src/** (regenerated output and patch-script output only)
    - sdk/.speakeasy/**
    - sdk/docs/patch-burndown.md
    - sdk/docs/PATCH-COUNT.txt
    - sdk/docs/adr/0008-generated-runtime-patches.md
    - sdk/tests/generated-runtime-patch.test.ts
    - .goals/G36-regen-patch-burndown.yaml
  forbidden:
    - sdk/src/extensions/**
    - sdk/src/mcp-server/curated/**
acceptance:
  - "Each probe-target patch is either removed with a passing gate or kept with a recorded probe result."
  - "PATCH-COUNT.txt equals the registry length."
  - "No regenerated diff touches sdk/src/extensions or sdk/src/mcp-server/curated."
commands:
  - "cd sdk && npm run verify:offline"
adversarial_checks:
  - "Removing a patch while its guard test still needs it fails the suite."
  - "A regenerated file under extensions or curated means the run is halted."
links:
  docs:
    - sdk/docs/patch-burndown.md
    - sdk/docs/adr/0008-generated-runtime-patches.md
  tests:
    - sdk/tests/generated-runtime-patch.test.ts
    - sdk/tests/generated-request-validation.test.ts
rollback: "git restore sdk/src and revert the bookkeeping commit."

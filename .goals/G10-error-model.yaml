id: G10
title: Error model decision tree
priority: P1
status: done
why: "Five surfaces (raw, facade, CLI, MCP, webhook) handle failure differently; users need a single doc that maps each surface to its expected error shape."
scope:
  allowed:
    - sdk/docs/ERRORS.md
    - sdk/docs/ERRORS.md
    - sdk/tests/error-model.test.ts
  forbidden:
    - sdk/src/funcs/**
    - sdk/src/sdk/**
    - sdk/src/models/**
    - sdk/src/lib/**
    - sdk/src/hooks/**
    - sdk/src/types/**
    - sdk/src/core.ts
    - sdk/src/index.ts
acceptance:
  - "docs/ERRORS.md names every category returned by categorizeError."
  - "docs/ERRORS.md covers raw SDK, facade, CLI, and MCP (merged from ERROR-MODEL.md 2026-08-10)."
  - "tests/error-model.test.ts enforces both."
  - "docs/ERRORS.md cross-links the new doc."
commands:
  - "cd sdk && npm test -- tests/error-model.test.ts"
  - "cd sdk && npm run goals:check"
adversarial_checks:
  - "Removing any category name fails the test."
  - "Dropping a surface section fails the test."
links:
  docs:
    - sdk/docs/ERRORS.md
    - sdk/docs/ERRORS.md
  tests:
    - sdk/tests/error-model.test.ts
rollback: "Revert this commit; ERRORS.md remains as before."

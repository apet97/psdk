version: 1
product:
  name: pumble-keys-sdk
  positioning: "Pumble TypeScript SDK / Developer Toolkit"
  not: "general SDK generator, multi-language code generator, Stainless/Speakeasy competitor"
guardrails:
  generated_paths:
    - sdk/src/funcs/**
    - sdk/src/sdk/**
    - sdk/src/models/**
    - sdk/src/lib/**
    - sdk/src/hooks/**
    - sdk/src/types/**
    - sdk/src/core.ts
    - sdk/src/index.ts
    - sdk/src/mcp-server/*.ts
    - sdk/src/mcp-server/build.mts
    - sdk/src/mcp-server/cli/**
    - sdk/src/mcp-server/tools/**
  forbidden_phrases:
    - "SDK generator platform"
    - "Stainless competitor"
    - "multi-language generator"
    - "production-grade"
    - "industrial-strength"
    - "world-class"
    - "best-in-class"

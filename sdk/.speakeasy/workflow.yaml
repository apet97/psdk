        target: typescript
        source: Pumble API Addon documentation
        codeSamples:
            registry:
                location: registry.speakeasyapi.dev/a5115/a5115/pumble-api-addon-documentation-typescript-code-samples
            labelOverride:
                fixedValue: Typescript (SDK)
            blocking: false

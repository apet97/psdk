arazzo: 1.0.1
info:
  title: Test Suite
  summary: Created from ./PumbleOpenApi.yaml
  version: 0.0.1
sourceDescriptions:
  - name: ./PumbleOpenApi.yaml
    url: https://TBD.com
    type: openapi
# NOTE: successCriteria deliberately verify status + content-type only,
# plus light structural JSONPath where it adds value. The mock server's
# fake bodies are not stable enough for exact-value assertions, and
# strict body matching repeatedly broke `speakeasy test` against the
# generated mock. x-speakeasy-test-rebuild is set to false so this file
# survives regeneration. (`speakeasy test` itself currently requires an
# Enterprise tier add-on — this file is kept ready for that day.)
workflows:
  - workflowId: listChannels
    steps:
      - stepId: test
        operationId: listChannels
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.header.Content-Type == application/json
          - context: $response.body
            condition: $
            type: jsonpath
    x-speakeasy-test-group: Channels
    x-speakeasy-test-rebuild: false
  - workflowId: getChannel
    steps:
      - stepId: test
        operationId: getChannel
        parameters:
          - name: channelId
            in: query
            value: bbbbbbbbbbbbbbbbbbbb0001
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.header.Content-Type == application/json
          - context: $response.body
            condition: $.channel.id
            type: jsonpath
    x-speakeasy-test-group: Channels
    x-speakeasy-test-rebuild: false
  - workflowId: createChannel
